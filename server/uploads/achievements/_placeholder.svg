<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a23"/>
      <stop offset="50%" stop-color="#1a1a4e"/>
      <stop offset="100%" stop-color="#0a0a23"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7a5cff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.15" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>
  <g transform="translate(800 450)">
    <circle r="120" fill="none" stroke="url(#ring)" stroke-width="4"/>
    <circle r="160" fill="none" stroke="url(#ring)" stroke-width="1" opacity="0.4"/>
    <text y="-12" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#eaeaf5">📸 Drop photos here</text>
    <text y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#7a7a9a">server/uploads/achievements/</text>
    <text y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#00d4ff">.jpg · .jpeg · .png · .webp</text>
  </g>
</svg>
