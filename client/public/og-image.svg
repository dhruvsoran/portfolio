<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a23" />
      <stop offset="100%" stop-color="#1a0a3a" />
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#7a5cff" />
      <stop offset="100%" stop-color="#ff6ec7" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5cff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7a5cff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="900" cy="200" r="280" fill="url(#glow)" />
  <circle cx="280" cy="500" r="220" fill="url(#glow)" opacity="0.7" />

  <g font-family="Inter, system-ui, sans-serif">
    <text x="80" y="160" font-size="28" font-weight="500" fill="#00d4ff" letter-spacing="4">PORTFOLIO · 2026</text>

    <text x="80" y="290" font-size="110" font-weight="900" fill="url(#title)">Dhruv Soran</text>

    <text x="80" y="370" font-size="42" font-weight="500" fill="#e0e0e0">AI App Developer</text>
    <text x="80" y="425" font-size="42" font-weight="500" fill="#a0a0c0">Full-Stack Engineer</text>

    <g transform="translate(80, 500)">
      <rect width="160" height="50" rx="25" fill="rgba(0, 212, 255, 0.15)" stroke="rgba(0, 212, 255, 0.4)" stroke-width="1" />
      <text x="80" y="33" font-size="20" font-weight="600" fill="#00d4ff" text-anchor="middle">GenAI</text>
    </g>
    <g transform="translate(260, 500)">
      <rect width="160" height="50" rx="25" fill="rgba(122, 92, 255, 0.15)" stroke="rgba(122, 92, 255, 0.4)" stroke-width="1" />
      <text x="80" y="33" font-size="20" font-weight="600" fill="#7a5cff" text-anchor="middle">LLMs</text>
    </g>
    <g transform="translate(440, 500)">
      <rect width="160" height="50" rx="25" fill="rgba(255, 110, 199, 0.15)" stroke="rgba(255, 110, 199, 0.4)" stroke-width="1" />
      <text x="80" y="33" font-size="20" font-weight="600" fill="#ff6ec7" text-anchor="middle">React</text>
    </g>
    <g transform="translate(620, 500)">
